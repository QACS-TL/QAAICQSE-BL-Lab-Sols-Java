server.address=127.0.0.1
# Required: a cryptographically random secret containing at least 32 bytes.
# Persist it outside source control. Changing it invalidates all existing JWTs.
app.jwt.secret=${USER_MANAGER_JWT_SECRET:}
# New passwords use bcrypt (cost 12) with SHA-256 prehashing.
# Existing PBKDF2 passwords are upgraded at successful login.
# Existing accounts must recover through email; legacy MD5 hashes are invalidated at startup.
app.mail.from=${USER_MANAGER_MAIL_FROM:}
spring.mail.host=${USER_MANAGER_SMTP_HOST:}
spring.mail.port=${USER_MANAGER_SMTP_PORT:587}
spring.mail.username=${USER_MANAGER_SMTP_USERNAME:}
spring.mail.password=${USER_MANAGER_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
